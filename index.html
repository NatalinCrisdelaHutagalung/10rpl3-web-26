<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <title>Natalin - Personal Microsite</title>

    <!-- Menghubungkan CSS -->
    <link rel="stylesheet" href="style.css">

<body>
    <div style="

    margin-bottom: 20px;
">

    <img
        src="profile.jpg"
        alt="Foto Profil Natalin"

            object-fit: cover;

            border: 4px solid #83a7d5;

</div>

</div>

            

            <h2>Natalin Crisdela Hutagalung</h2>

            <a href="form_biodata.html" class="file-card">

            <!-- File 2 -->
            <a href="hasil_biodata.html" class="file-card">

                </div>

                    <span class="file-description">

                    </span>
                </div>

            </a>


            <!-- File 3 -->
            <a href="tabel.html" class="file-card">

                <div class="file-icon">
                    ▯
                </div>

                <div class="file-text">
                    <span class="file-name">
                        tabel.html
                    </span>

                    <span class="file-description">
                        Tabel Data &amp; Informasi
                    </span>
                </div>

            </a>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        © <span id="year"></span> Natalin • X RPL 3

    <!-- Menghubungkan JavaScript -->
    <script src="script.js"></script>
