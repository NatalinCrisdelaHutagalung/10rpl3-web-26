<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Hasil Biodata - Natalin</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- Background gunung -->
    <div class="mountains">

        <div class="mountain mountain-1"></div>

        <div class="mountain mountain-2"></div>

        <div class="mountain mountain-3"></div>

    </div>


    <main class="biodata-container">


        <!-- Judul -->
        <div class="biodata-header">

            <p class="small-title">
                PERSONAL MICROSITE
            </p>

            <h1>
                HASIL BIODATA
            </h1>

            <p class="subtitle">
                Data Diri Natalin
            </p>

        </div>



        <!-- Kartu biodata -->
        <section class="biodata-card">


            <!-- Foto -->
            <div class="biodata-photo">

                <img
                    src="profile.jpg"
                    alt="Foto Profil Natalin"
                >

            </div>


            <!-- Nama -->
            <h2>
                Natalin Crisdela Hutagalung
            </h2>

            <p class="biodata-role">
                Student • X RPL 3
            </p>


            <!-- Garis -->
            <div class="line"></div>



            <!-- Informasi -->
            <div class="biodata-info">


                <!-- Nama -->
                <div class="info-item">

                    <div class="info-icon">
                        👤
                    </div>

                    <div class="info-text">

                        <span>
                            Nama Lengkap
                        </span>

                        <strong>
                            Natalin Crisdela Hutagalung
                        </strong>

                    </div>

                </div>



                <!-- Kelas -->
                <div class="info-item">

                    <div class="info-icon">
                        🎓
                    </div>

                    <div class="info-text">

                        <span>
                            Kelas
                        </span>

                        <strong>
                            X RPL 3
                        </strong>

                    </div>

                </div>



                <!-- Jurusan -->
                <div class="info-item">

                    <div class="info-icon">
                        💻
                    </div>

                    <div class="info-text">

                        <span>
                            Jurusan
                        </span>

                        <strong>
                            Rekayasa Perangkat Lunak
                        </strong>

                    </div>

                </div>



                <!-- Tema -->
                <div class="info-item">

                    <div class="info-icon">
                        🏔️
                    </div>

                    <div class="info-text">

                        <span>
                            Tema Microsite
                        </span>

                        <strong>
                            Mountain &amp; Nature
                        </strong>

                    </div>

                </div>


            </div>



            <!-- Tombol -->
            <a
                href="index.html"
                class="back-button"
            >
                ← Kembali ke Beranda
            </a>


        </section>


    </main>



    <footer class="biodata-footer">

        © <span id="year"></span> Natalin • X RPL 3

    </footer>


    <script src="script.js"></script>

</body>

</html>
