<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Form Biodata</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="container">

        <div class="header">

            <h1>FORM BIODATA</h1>

            <p class="subtitle">
                Input Data Diri
            </p>

        </div>


        <section class="files">

            <form>

                <div class="form-group">

                    <label>Nama Lengkap</label>

                    <input
                        type="text"
                        name="nama"
                        placeholder="Masukkan nama lengkap"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Kelas</label>

                    <input
                        type="text"
                        name="kelas"
                        placeholder="Contoh: X RPL 3"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Tempat Lahir</label>

                    <input
                        type="text"
                        name="tempat"
                        placeholder="Masukkan tempat lahir"
                    >

                </div>


                <div class="form-group">

                    <label>Tanggal Lahir</label>

                    <input
                        type="date"
                        name="tanggal"
                    >

                </div>


                <div class="form-group">

                    <label>Alamat</label>

                    <textarea
                        name="alamat"
                        placeholder="Masukkan alamat"
                    ></textarea>

                </div>


                <button type="submit">
                    Simpan Data
                </button>

            </form>


            <br>


            <a href="index.html"
               class="file-card">

                ← Kembali ke Beranda

            </a>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
